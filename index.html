<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Код Креатора</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Код Креатора">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#0d0d0d;--panel:#161512;--panel2:#201e19;--line:#2e2b24;--text:#f3efe6;--muted:#a29b8c;
  --sun:#FFAD05;--sun-ink:#1a1200;--ok:#5fcf8a;--bad:#ff6b5b;
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --tabh:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);min-height:100%;overscroll-behavior-y:none}
body{font-family:var(--f-display);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
a{color:var(--sun)}

#app{min-height:100vh;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 20px;text-align:center;min-height:100vh}
.logo{font-weight:900;font-size:28px;letter-spacing:.02em;line-height:1}.logo span{color:var(--sun)}
.center p{margin:0;color:var(--muted);font-size:14px;max-width:34ch}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sun);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px 24px;display:flex;flex-direction:column;gap:18px;align-items:center}
.tgw{min-height:44px;display:grid;place-items:center}

.top{position:sticky;top:0;z-index:4;background:var(--ink);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top .back{color:var(--sun);font-weight:600;font-size:14px;min-width:64px;text-align:left}
.top .t{flex:1;min-width:0;font-weight:800;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{min-width:64px}
.top .rf{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:19px;display:grid;place-items:center}
.top .rf:active,.top .rf.spin{color:var(--sun)}
.top .rf.spin{animation:rfspin .8s linear infinite}
@keyframes rfspin{to{transform:translateY(-50%) rotate(360deg)}}
.ptr{position:fixed;left:50%;top:0;z-index:9;transform:translate(-50%,-60px);width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--sun);font-size:20px;transition:transform .15s;pointer-events:none}
.ptr.go{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{from{rotate:0deg}to{rotate:360deg}}
.top.home .t{text-align:left}
.logo-s{font-weight:900;letter-spacing:.03em;font-size:15px}.logo-s span{color:var(--sun)}
.user{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user b{color:var(--text)}

.wrap{flex:1;min-height:0;display:flex}
.side{display:none}
.main{flex:1;min-width:0;padding:16px 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom))}
.inner{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* нижнее меню */
body.kb .tabs{display:none!important}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));background:color-mix(in srgb,var(--panel) 94%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--muted);font-size:10px;letter-spacing:-.01em;font-weight:600;line-height:1.15;text-align:center}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--sun)}
.tab.hw .ic{background:var(--sun);color:var(--sun-ink);border-radius:12px;width:40px;height:30px;display:grid;place-items:center;margin-top:-3px}
.tab.hw .ic svg{width:20px;height:20px}
.tab.hw.on{color:var(--text)}

h1.h{margin:0;font-size:clamp(22px,4vw,30px);font-weight:900;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:-8px 0 0;color:var(--muted);font-size:13.5px}
.hello h1{font-size:clamp(24px,4vw,32px);font-weight:900;line-height:1.1;margin:0;letter-spacing:-.01em}
.hello p{margin:4px 0 0;color:var(--muted);font-size:13.5px}

.cont{background:var(--sun);color:var(--sun-ink);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.cont .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.cont b{font-size:17px;line-height:1.2;font-weight:800}
.bar{height:5px;background:rgba(0,0,0,.18);border-radius:3px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--sun-ink)}
.bar.y{background:var(--panel2)}.bar.y i{background:var(--sun)}
.sec-t{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}

.mods{display:flex;flex-direction:column}
.mod{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.mods .mod:first-child{border-top:0}
.num{width:42px;height:42px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-weight:900;color:var(--sun);font-size:15px}
.mod b{font-size:14.5px;display:block;line-height:1.25}
.mod small,.les small{color:var(--muted);font-size:12px}
.pr{font-family:var(--f-mono);font-size:12px;color:var(--muted)}.pr.full{color:var(--ok)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}

.lessons{display:flex;flex-direction:column;gap:8px}
.les{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border-radius:14px;padding:12px;text-align:left;width:100%;color:var(--text);text-decoration:none}
.les b{font-size:14px;line-height:1.25;display:block;font-weight:600}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:900}
.les.done .ck,.d-les.done .ck{background:var(--ok);border-color:var(--ok);color:#06210f}
.les.cur .ck{border-color:var(--sun)}
.les.lock{opacity:.5}

.chip{font-family:var(--f-mono);font-size:10.5px;border-radius:20px;padding:3px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.chip.sent{color:var(--sun);border-color:color-mix(in srgb,var(--sun) 45%,transparent)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.redo{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}

.crumbs{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--panel)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video[data-vid]{cursor:pointer}
.video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video .vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.video .vplay svg{margin-left:5px}
.video .vload{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.body-text .video{margin:14px 0}
.body-text{font-size:15px;line-height:1.6;color:#e4ded1;overflow-wrap:break-word;word-break:normal;hyphens:manual}
.body-text>*:first-child{margin-top:0}.body-text>*:last-child{margin-bottom:0}
.body-text img{max-width:100%;height:auto;border-radius:12px}
.body-text .gap{display:block;height:12px}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;gap:12px;align-items:center;background:var(--panel);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--text);text-align:left;width:100%}
.file .ext{font-family:var(--f-mono);font-size:10px;width:42px;height:40px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;color:var(--sun);flex:none;text-align:center;line-height:1.1}
.file b{font-size:13.5px;display:block;font-weight:600;line-height:1.3}.file small{color:var(--muted);font-size:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box>b{font-size:15px}
.box .body-text{font-size:14px}
.reply{border-left:2px solid var(--sun);padding-left:12px;font-size:14px;color:#e4ded1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
input[type=url],input[type=search],input[type=email],input[type=tel],input[type=text],input:not([type]),textarea{font:inherit;font-size:15px;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=file]{font-size:13px;color:var(--muted)}
.btn{display:block;border-radius:13px;padding:13px;font-weight:800;font-size:14.5px;text-align:center;width:100%;text-decoration:none}
.btn.y{background:var(--sun);color:var(--sun-ink)}
.btn.g{background:var(--panel2);color:var(--text)}
.btn.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.btn[disabled]{opacity:.6;cursor:default}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--ink);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}
.hint{font-size:12.5px;color:var(--muted);margin:0}

.me-head{display:flex;gap:16px;align-items:center}
.ava{width:72px;height:72px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-weight:900;font-size:26px;flex:none;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.me-head b{font-size:20px;font-weight:900;display:block;line-height:1.15}
.me-head small{color:var(--muted);font-size:13px;display:block}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}.kv span{color:var(--muted)}.kv b{text-align:right;font-weight:700;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border-radius:14px;padding:14px}
.stat b{font-size:24px;font-weight:900;display:block;line-height:1}.stat small{color:var(--muted);font-size:12px}
.pay-ok{display:flex;gap:12px;align-items:center;color:var(--ok);font-weight:700}
.plan{display:flex;flex-direction:column}
.plan div{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.plan div:first-child{border-top:0}
.plan .paid{color:var(--muted)}.plan .paid b{text-decoration:line-through;font-weight:600}
.plan .nx{color:var(--sun)}
.next{background:color-mix(in srgb,var(--sun) 12%,transparent);border:1px solid color-mix(in srgb,var(--sun) 40%,transparent);border-radius:14px;padding:12px 14px;font-size:14px}
.next b{font-size:18px;font-weight:900;display:block}

.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;background:var(--text);color:var(--ink);font-weight:700;font-size:13.5px;border-radius:12px;padding:11px 14px;z-index:9;text-align:center}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(520px,100%);background:var(--panel);border-radius:22px 22px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:17px;font-weight:800}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#e4ded1}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 0}
mark{background:color-mix(in srgb,var(--sun) 35%,transparent);color:inherit;border-radius:3px}

/* обложки */
.banner{width:100%;border-radius:18px;display:block;aspect-ratio:1400/387;object-fit:cover;background:var(--panel)}
.covers{display:grid;grid-template-columns:1fr;gap:14px}
.cover{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.cover img{width:100%;aspect-ratio:930/418;object-fit:cover;border-radius:16px;display:block;background:var(--panel)}
.cover .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px;font-size:13px;color:var(--muted)}
.cover .meta .bar{flex:1;max-width:160px}
.mod-cover{width:100%;aspect-ratio:930/418;object-fit:cover;border-radius:18px;display:block}
.les.th{grid-template-columns:112px minmax(0,1fr) auto;padding:8px}
.les .thumb{position:relative;width:112px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--panel2)}
.les .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.les .thumb .ck{position:absolute;left:6px;top:6px;width:22px;height:22px;font-size:11px;background:rgba(13,13,13,.7);border-color:rgba(255,255,255,.5)}
.les.done .thumb .ck{background:var(--ok);border-color:var(--ok)}
.gbtn{display:flex;flex-direction:column;gap:8px}
.gbtn .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gbtn a.btn{width:auto;flex:1;min-width:200px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:700;text-decoration:none;background:var(--panel2);color:var(--text);border:1px solid var(--line);margin:2px 2px;vertical-align:middle;white-space:nowrap}
.pill i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:900}
.pill.ya i{background:#fc3f1d;color:#fff}.pill.gd i{background:#1fa463;color:#fff}.pill.tg i{background:#2aabee;color:#fff}
.pill.ig i{background:#d62976;color:#fff}.pill.yt i{background:#ff0000;color:#fff}.pill.gf i{background:#7248b9;color:#fff}.pill.ln i{background:var(--sun);color:var(--sun-ink)}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;align-items:start}
.mat{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--text)}
.mat .pic{border-radius:14px;overflow:hidden;background:var(--panel2);display:block;aspect-ratio:4/5}
.mat .pic img{width:100%;height:100%;object-fit:cover;display:block}
.mat b{font-size:13px;line-height:1.3;font-weight:700}.mat small{color:var(--muted);font-size:11.5px;margin-top:-4px}
.lvl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
.lvl img{width:100%;border-radius:14px;display:block}
.lvl .ring{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.lvl .ring svg{width:min(150px,100%);height:auto}
.lvl .ring b{font-size:13.5px;line-height:1.3}
@media (min-width:600px){.lvl{grid-template-columns:240px 1fr;max-width:560px}}
@media (min-width:600px){.covers{grid-template-columns:repeat(2,minmax(0,1fr))}.mats{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* сдать ДЗ: плитки */
.hw-top{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.hw-top .bar{flex:1;height:7px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 9px 7px;min-height:62px}
.tile .no{font-family:var(--f-mono);font-size:11px;color:var(--sun)}
.tile b{font-size:11.5px;line-height:1.22;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .st{position:absolute;right:9px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--line)}
.tile.sent{border-color:color-mix(in srgb,var(--sun) 55%,transparent)}.tile.sent .st{background:var(--sun)}
.tile.ok{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}.tile.ok .st{background:var(--ok)}
.tile.redo{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}.tile.redo .st{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
/* мастер ДЗ */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--panel);color:var(--text)}
.chipbtn.on{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.chipbtn.has{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.chipbtn.redo{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.les.pick{outline:2px solid var(--sun)}
/* портфолио */
.pf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.job{gap:10px!important}
.job .kind{font-family:var(--f-display);font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sun)}
.job .vac{border-left:3px solid var(--sun);padding:6px 0 6px 12px;font-weight:800;font-size:16px;line-height:1.3}
.job .meta{display:flex;flex-wrap:wrap;gap:6px}
.job .meta span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.job .row{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.job .row b{color:var(--sun)}
.job .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.job ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.job p{margin:0;font-size:14px;line-height:1.5}
.job .mot{background:color-mix(in srgb,var(--sun) 10%,transparent);border-radius:12px;padding:10px 12px;font-size:13.5px}
.job .note{font-size:12.5px;color:var(--muted)}
.job .acts{display:grid;grid-template-columns:1fr auto;gap:8px}
.cnt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cnt button{width:36px;height:36px;border-radius:10px;background:var(--panel2);font-weight:800;font-size:18px;color:var(--text)}
.job-about{font-size:14px;line-height:1.5;white-space:pre-line;color:var(--text)}
.job-about.cut{max-height:9.5em;overflow:hidden;position:relative;cursor:pointer}
.job-about.cut::after{content:"Подробнее ↓";position:absolute;left:0;right:0;bottom:0;padding-top:28px;background:linear-gradient(transparent,var(--panel) 70%);color:var(--sun);font-weight:700;font-size:13px}
.pf button,.pf a{display:flex;flex-direction:column;gap:6px;text-align:left;color:inherit;text-decoration:none}
.pf-host{position:absolute;top:8px;left:8px;right:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:4px 7px;width:max-content;max-width:calc(100% - 16px)}
.pf .pic{position:relative;aspect-ratio:9/12;border-radius:14px;overflow:hidden;background:var(--panel2)}
.pf .pic img{width:100%;height:100%;object-fit:cover}
.pf .pic::after{content:"▶";position:absolute;inset:auto auto 10px 10px;width:34px;height:34px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-size:13px}
.pf b{font-size:12.5px;font-weight:700;line-height:1.25}
.player{width:min(520px,100%);background:var(--ink);border-radius:18px;overflow:hidden;margin:auto 12px;align-self:center}
.player iframe{width:100%;aspect-ratio:9/14;max-height:78vh;border:0;display:block}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.pf{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* компьютер: меню слева вместо нижнего */
@media (min-width:900px){
  .tabs{display:none}
  .top .sp{display:none}
  .top .t{text-align:left;flex:none}
  .wrap{height:calc(100vh - 57px)}
  .side{display:flex;flex-direction:column;gap:2px;width:310px;flex:none;overflow:auto;border-right:1px solid var(--line);padding:16px 12px}
  .main{overflow:auto;padding:28px clamp(16px,4vw,48px) 40px}
  .inner{margin:0}
  .toast{bottom:24px}
  .s-nav{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;width:100%;text-align:left;font-weight:700;font-size:14px;color:#d9d2c3}
  .s-nav svg{width:20px;height:20px;color:var(--muted)}
  .s-nav:hover{background:var(--panel)}
  .s-nav.on{background:var(--panel2);color:var(--text)}.s-nav.on svg{color:var(--sun)}
  .s-sep{height:1px;background:var(--line);margin:10px 4px}
  .d-prog{padding:4px 10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
  .d-mod{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;text-align:left;width:100%}
  .d-mod:hover,.d-les:hover{background:var(--panel)}
  .d-mod .n{font-weight:900;color:var(--sun);font-size:14px;text-align:center}
  .d-mod b{font-size:13.5px;line-height:1.25;font-weight:700}
  .d-mod small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
  .d-les{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;padding:7px 8px 7px 46px;border-radius:8px;text-align:left;width:100%;font-size:13px;color:#d9d2c3;line-height:1.3}
  .d-les.on{background:var(--panel2);color:var(--text);font-weight:600}
  .d-les.lock{opacity:.5}
  .d-les .ck{width:16px;height:16px;border-width:1.5px;font-size:10px;margin-top:1px}
  .grid-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .grid-mods .mod{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--panel);border:0;border-radius:16px;padding:16px;min-height:130px}
  .grid-mods .mod:hover{background:var(--panel2)}
  .grid-mods .mod .pr{margin-top:auto}
  .navrow{display:flex;gap:10px}.navrow .btn{width:auto;padding:12px 22px}
}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="logo">КОД<br><span>КРЕАТОРА</span></div><div class="spinner"></div></div></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbw2LmiS_HoOdrIQko16UGsLNQj6T1Br2BymAb2bh8_iHPxOB8QyVgbiZ0vuPcwhHCPwyQ/exec";
const BOT = "oebybusha_bot";
const HELP = "https://t.me/bushas_team"; // отдел заботы — Busha’s team (профиль №4)
const BUSHA_TG = "https://t.me/apollinaria_busha"; // Буша лично (профиль №1)
const TGK = "https://t.me/+kI7-_Q5Mnh80ZGUy"; // Telegram-канал программы
// скрипт Telegram грузим только внутри Telegram: на сайте и в иконке на телефоне он не нужен (а в России без VPN telegram.org не открывается)
let TG = null;
const IN_TG = /tgWebApp/.test(location.hash + location.search) || !!window.TelegramWebviewProxy;
function loadTG(){return new Promise(ok=>{if(!IN_TG)return ok();const s=document.createElement("script");s.src="https://telegram.org/js/telegram-web-app.js";
  const t=setTimeout(ok,6000);s.onload=()=>{clearTimeout(t);const w=window.Telegram&&Telegram.WebApp;if(w&&w.initData)TG=w;ok()};s.onerror=()=>{clearTimeout(t);ok()};document.head.appendChild(s)})}
const app = document.getElementById("app");
const S = { session:null, user:null, mods:[], mats:[], done:new Set(), subs:[], lsName:"Полине", open:new Set(), acc:null, q:"" };
const wide = () => matchMedia("(min-width:900px)").matches;

const IC = {
  les:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
  kb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>',
  mat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>',
  hw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 10l5-5 5 5"/><path d="M5 19h14"/></svg>',
  job:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18"/></svg>',
  st:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c1-3.3 3.6-5 6.5-5s5.5 1.7 6.5 5"/><circle cx="17" cy="9.5" r="2.7"/><path d="M16.5 14.6c2.6.2 4.3 1.9 5 4.4"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'
};
const TABS = [["", "База знаний", "les", "База<br>знаний"], ["mat", "Полезные материалы", "mat", "Полезные<br>материалы"], ["hw", "Сдать ДЗ", "hw", "Сдать ДЗ"], ["jobs", "Биржа заказов", "job", "Биржа<br>заказов"], ["me", "Профиль", "me", "Профиль"]];

function tabs(){if(!(S.user&&S.user.a))return TABS;const t=[...TABS];t.splice(3,0,["st","Ученики","st","Ученики"]);return t}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function rub(n){return Math.round(n).toLocaleString("ru-RU")+" ₽"}
function fmtDate(s){const m=String(s).match(/(\d{4})-(\d\d)-(\d\d)/);if(!m)return s;const mon=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];return `${+m[3]} ${mon[+m[2]-1]}`}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;return n>10&&n<20?c:n1>1&&n1<5?b:n1===1?a:c}

async function call(body, tries=3){
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
      return JSON.parse(await r.text());
    }catch(e){ if(i===tries-1) throw e; await new Promise(r=>setTimeout(r,800*(i+1))); }
  }
}
async function api(body){
  const res=await call({...body,session:S.session});
  if(res&&res.error==="auth"){store("kk_session");store("kk_course");S.session=null;start();throw new Error("auth")}
  if(res&&res.error==="soon"){showSoon();throw new Error("auth")}
  return res;
}

/* ---------- вход ---------- */
function screen(html){app.innerHTML=`<div class="center">${html}</div>`}
function logo(){return `<div class="logo">КОД<br><span>КРЕАТОРА</span></div>`}

async function start(){
  await loadTG();
  // Telegram дописывает в адрес #tgWebAppData=… — после чтения убираем, иначе роутер принимает это за раздел
  if(/tgWebApp/.test(location.hash))history.replaceState(null,"",location.pathname+location.search);
  if(TG){TG.BackButton.onClick(goBack);TG.ready();TG.expand();try{TG.setHeaderColor("#0d0d0d");TG.setBackgroundColor("#0d0d0d")}catch(e){}}
  S.session=load("kk_session");
  // пришла по ссылке с ключом входа (из Telegram → Safari → иконка «Домой») — входим без почты
  const qs=new URLSearchParams(location.search),ho=qs.get("login");
  if(ho){qs.delete("login");history.replaceState(null,"",location.pathname+(qs.toString()?"?"+qs:"")+location.hash);
    if(!S.session){try{const r=await call({api:"handin",token:ho});if(r.ok){S.session=r.session;store("kk_session",r.session)}}catch(e){}}}
  if(TG && !S.session){ screen(`${logo()}<div class="spinner"></div><p>Проверяем доступ к программе…</p>`); return doLogin({initData:TG.initData}); }
  if(S.session) return loadCourse();
  showLogin();
}

function showLogin(msg){
  const mail=load("kk_mail")||"";
  screen(`<div class="card">${logo()}
    <p>${msg||"Приложение программы КОД КРЕАТОРА. Введи почту, которую ты указывала при оплате, — пришлём код для входа."}</p>
    ${/iphone|ipad|ipod/i.test(navigator.userAgent)&&!TG&&!navigator.standalone?`<div class="box" style="flex-direction:row;align-items:center;gap:10px;text-align:left;width:100%"><span style="font-size:22px">📲</span><span style="flex:1;font-size:13px">Сначала добавь приложение на экран «Домой» и входи уже с иконки — так войдёшь один раз и сможешь включить уведомления.</span><button type="button" class="btn g" style="width:auto;padding:8px 12px" onclick="installSheet()">Как</button></div>`:""}
    <form id="mf" style="display:grid;gap:10px;width:100%">
      <input name="email" type="email" inputmode="email" autocomplete="email" placeholder="твоя@почта.ru" value="${esc(mail)}" required>
      <button class="btn y" type="submit">Получить код</button>
    </form>
    <details style="width:100%;margin-top:6px"><summary style="font-size:13px;cursor:pointer;opacity:.75">Войти через Telegram</summary><div class="tgw" id="tgw" style="margin-top:10px"></div></details>
    <p style="font-size:12.5px">Не приходит письмо или почта не подходит — напиши в <a href="${HELP}">отдел заботы</a>.</p></div>`);
  document.getElementById("mf").onsubmit=async e=>{e.preventDefault();const em=e.target.email.value.trim().toLowerCase();if(!em)return;
    const btn=e.target.querySelector("button");btn.disabled=true;btn.textContent="Отправляем…";
    let res;try{res=await call({api:"mailcode",email:em})}catch(x){btn.disabled=false;btn.textContent="Получить код";return toast("Нет связи с сервером")}
    if(res.ok){store("kk_mail",em);return showCode(em)}
    btn.disabled=false;btn.textContent="Получить код";
    if(res.error==="expired"||res.error==="soon")return doLoginResult(res);
    if(res.error==="not_student_mail")return showLogin(`Не нашли почту <b>${esc(em)}</b> в списке учениц. Проверь, та ли это почта, что ты давала при оплате, или напиши в <a href="${HELP}">отдел заботы</a>.`);
    toast(res.error)};
  document.querySelector("details").ontoggle=function(){if(!this.open||document.querySelector("#tgw script"))return;
    const s=document.createElement("script");s.async=true;s.src="https://telegram.org/js/telegram-widget.js?22";
    s.setAttribute("data-telegram-login",BOT);s.setAttribute("data-size","large");s.setAttribute("data-radius","12");
    s.setAttribute("data-onauth","onTgAuth(user)");s.setAttribute("data-request-access","write");document.getElementById("tgw").appendChild(s)};
}
function showCode(em,msg){
  screen(`<div class="card">${logo()}
    <p>${msg||`Отправили код на <b>${esc(em)}</b>. Введи 6 цифр из письма (проверь «Спам», если не видно).`}</p>
    <form id="cf" style="display:grid;gap:10px;width:100%">
      <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" style="text-align:center;font-size:26px;letter-spacing:8px" required>
      <button class="btn y" type="submit">Войти</button>
    </form>
    <p style="font-size:13px"><a href="#" id="again">Другая почта / прислать ещё раз</a></p></div>`);
  const f=document.getElementById("cf");f.code.focus();
  f.code.oninput=()=>{if(f.code.value.replace(/\D/g,"").length===6)f.requestSubmit()};
  document.getElementById("again").onclick=e=>{e.preventDefault();showLogin()};
  f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector("button");btn.disabled=true;btn.textContent="Проверяем…";
    let res;try{res=await call({api:"mailin",email:em,code:f.code.value})}catch(x){btn.disabled=false;btn.textContent="Войти";return toast("Нет связи с сервером")}
    if(res.ok){S.session=res.session;store("kk_session",res.session);return loadCourse()}
    if(res.error==="not_student_mail")return showLogin();
    showCode(em,esc(res.error))};
}
window.onTgAuth=u=>{screen(`${logo()}<div class="spinner"></div><p>Проверяем доступ к программе…</p>`);doLogin({widget:u})};

async function doLogin(data){
  let res;
  try{res=await call({api:"login",...data})}catch(e){return screen(`${logo()}<p>Не получилось связаться с сервером. Проверь интернет и обнови страницу.</p><button class="btn y" style="max-width:260px" onclick="location.reload()">Обновить</button>`)}
  if(res.ok){S.session=res.session;store("kk_session",res.session);return loadCourse()}
  return doLoginResult(res);
}
function showSoon(){store("kk_course");screen(`${logo()}<p style="font-size:17px;font-weight:700;color:var(--text)">Приложение программы откроется совсем скоро 💛</p><p>Мы уже всё готовим. Как только откроемся — напишем в Telegram-канале программы, и ты сможешь войти по своей почте.</p><button class="btn g" onclick="location.reload()">Обновить</button>`)}
function doLoginResult(res){
  if(res.error==="soon")return showSoon();
  if(res.error==="expired")return screen(`${logo()}<p>Твой доступ к программе закрылся ${esc(fmtDate(res.until))}. Спасибо, что была с нами 💛</p><p>Если нужно продлить доступ — напиши в <a href="${HELP}">отдел заботы</a>.</p>`);
  if(res.error==="not_student"){
    const nick=res.username?"@"+esc(res.username):"без ника";
    return screen(`${logo()}<p>Не нашли твой Telegram (${nick}) в списке учениц программы.</p><p>Если ты ученица, напиши в <a href="${HELP}">отдел заботы @bushas_team</a> — проверим ник. ${res.username?"":"И задай себе ник в настройках Telegram: по нему мы тебя узнаём."}</p><button class="btn y" style="max-width:260px" onclick="showLogin()">Войти по почте</button>`);
  }
  TG?screen(`${logo()}<p>Не получилось войти: ${esc(res.error)}</p><button class="btn y" style="max-width:260px" onclick="location.reload()">Попробовать ещё раз</button>`):showLogin("Не получилось войти: "+esc(res.error)+". Попробуй ещё раз.");
}

async function loadCourse(){
  const cached=load("kk_course");
  if(cached){try{apply(JSON.parse(cached));route()}catch(e){}}
  else screen(`${logo()}<div class="spinner"></div><p>Загружаем программу…</p>`);
  let res;
  try{res=await api({api:"course"})}catch(e){if(e.message==="auth")return;if(!cached)screen(`${logo()}<p>Нет связи с сервером. Обнови страницу чуть позже.</p>`);return}
  if(!res.ok){if(!cached)screen(`${logo()}<p>Ошибка: ${esc(res.error)}</p>`);return}
  store("kk_course",JSON.stringify(res));apply(res);handoffUrl();
  if(!document.querySelector("#hwf"))route(); // не сбрасываем форму ДЗ, если ученица её заполняет
}
function apply(res){S.user=res.user;S.mods=res.mods;S.mats=res.mats||[];S.done=new Set(res.done);S.subs=res.hw||[];S.tests=res.tests||{};S.testRes=res.testRes||{};S.lsName=res.lsName||"Полине"}
function saveCache(){try{const c=JSON.parse(load("kk_course")||"{}");c.done=[...S.done];c.hw=S.subs;store("kk_course",JSON.stringify(c))}catch(e){}}

/* ---------- данные ---------- */
const allLes=()=>S.mods.flatMap(m=>m.les.map(l=>({...l,m})));
function findLes(id){return allLes().find(l=>l.id===id)}
function modDone(m){return m.les.filter(l=>S.done.has(l.id)).length}
function pct(){const a=allLes();return a.length?Math.round(a.filter(l=>S.done.has(l.id)).length/a.length*100):0}
function nextLes(){return allLes().find(l=>!l.locked&&!S.done.has(l.id))||allLes()[0]}
function nextAfter(id){const a=allLes(),i=a.findIndex(l=>l.id===id);return a.slice(i+1).find(l=>!l.locked)}

/* ---------- каркас ---------- */
function section(){const h=location.hash.slice(1);if(h==="st"||/^hw\/(check|s\/|rv\/)/.test(h))return "st";for(const k of ["mat","hw","jobs","me"])if(h.startsWith(k))return k;return ""}
let LAST_H=null;const KEEP={t:0,y:0};
function route(){
  if(!S.user)return;
  {const m=document.getElementById("main");KEEP.t=m?m.scrollTop:0;KEEP.y=window.scrollY}
  const h=decodeURIComponent(location.hash.slice(1));
  let view,title="",back=false;
  S.cur=null;
  if(h.startsWith("l/")){const l=findLes(h.slice(2));if(l){view=lessonView(l);title="Урок "+l.id;back=true;S.open.add(l.m.n);S.cur=l.id}}
  else if(h.startsWith("m/")){const m=S.mods.find(m=>m.n===h.slice(2));if(m){view=moduleView(m);title="Модуль "+m.n;back=true;S.open.add(m.n)}}
  else if(h.startsWith("test/")){const l=findLes(h.slice(5));if(l){view=testView(l);title="Тест";back=true}}
  else if(h.startsWith("hw/new")){view=wizardView(h.slice(7));title="Сдать работу";back=true}
  else if(h==="mat")view=matView();
  else if(h==="hw")view=hwListView();
  else if(h==="st"&&S.user.a)view=studentsView();
  else if(h==="hw/check"){view=reviewView();title="Проверка ДЗ";back=true}
  else if(h.startsWith("hw/s/")){view=studentView(h.slice(5));title="Ученица";back=true}
  else if(h.startsWith("hw/rv/")){view=reviewItem(h.slice(6));title="Проверка";back=true}
  else if(h==="me")view=meView();
  else if(h==="jobs")view=jobsView();
  if(!view)view=homeView();
  const sec=section();
  app.innerHTML=`<header class="top ${back?"":"home"}">
      ${back&&!TG?`<button class="back" onclick="goBack()">‹ Назад</button>`:""}
      <span class="t">${!back||wide()?`<span class="logo-s">КОД <span>КРЕАТОРА</span></span>`:esc(title)}</span>
      ${wide()?`<span class="user"><b>${esc(S.user.n)}</b> · @${esc(S.user.u)}</span>`:back&&!TG?`<span class="sp"></span>`:""}
      ${wide()?"":`<button class="rf" onclick="refreshAll()" aria-label="Обновить">↻</button>`}
    </header>
    <div class="wrap"><aside class="side">${sideView(sec)}</aside><main class="main" id="main"><div class="inner">${view}</div></main></div>

function videoHtml(v){

// красивые ссылки: вместо голого адреса — кнопочка с названием сервиса
function svc(u){
  if(/disk\.yandex|yadi\.sk/.test(u))return ["ya","Я","Яндекс Диск"];
  if(/docs\.google\.com\/forms|forms\.gle/.test(u))return ["gf","≡","Google Форма"];
  if(/drive\.google|docs\.google/.test(u))return ["gd","G","Google Диск"];
  if(/t\.me\//.test(u))return ["tg","✈",/bushas_help_bot/.test(u)?"Бот-помощник":/t\.me\/\+/.test(u)?"Чат программы":"Telegram"];
  if(/instagram\.com/.test(u))return ["ig","◎",/\/reel\//.test(u)?"Пример: reels":"Instagram"];
  if(/youtu\.?be/.test(u))return ["yt","▶","YouTube"];
  if(/pin\.it|pinterest/.test(u))return ["ln","P","Pinterest"];
  return ["ln","↗",u.replace(/^https?:\/\/(www\.)?/,"").split("/")[0]];
}
function pill(u,label){const [c,ic,t]=svc(u);return `<a class="pill ${c}" href="${esc(u)}" target="_blank" rel="noopener"><i>${ic}</i>${esc(label||t)}</a>`}
// конспекты из ГК: пустые абзацы-отбивки (<p><br></p>) шли подряд по 2–3 — сводим к одной короткой отбивке, после подзаголовка убираем
function tidy(h){
  const SP=/<p>(?:\s|&nbsp;|<br\s*\/?>|<(strong|b|em|i|span)[^>]*>(?:\s|&nbsp;|<br\s*\/?>)*<\/\1>)*<\/p>|<h\d>\s*<\/h\d>/gi;
  h=String(h||"").replace(SP,'<i class="gap"></i>').replace(/<br\s*\/?>\s*<\/p>/gi,"</p>");
  h=h.replace(/(<i class="gap"><\/i>\s*)+/g,'<i class="gap"></i>');
  h=h.replace(/(<p>\s*<(strong|b)>[^<]*<\/\2>\s*<\/p>)\s*<i class="gap"><\/i>/gi,"$1");
  return h.replace(/^\s*<i class="gap"><\/i>|<i class="gap"><\/i>\s*$/g,"");
}
function prettyLinks(h){
  h=tidy(h);
  return h.replace(/<a href="([^"]+)"[^>]*>(.*?)<\/a>/g,(all,u,txt)=>{u=u.replace(/&amp;/g,"&");const t=txt.replace(/<[^>]+>/g,"").trim();
    return /^(https?:\/\/|www\.)|^[\w.-]+\.(ru|com|io|me)(\/|$)/i.test(t)||!t?pill(u):`<a href="${esc(u)}" target="_blank" rel="noopener">${txt}</a>`})
   .replace(/(^|[\s>(])(https?:\/\/[^\s<)"]+)/g,(all,pre,u)=>pre+pill(u));
}
function btnBlock(files){
  if(!files.length)return "";
  return `<div class="gbtn">${files.map(f=>f.u.length===1?`<a class="btn y" href="${esc(f.u[0])}" target="_blank" rel="noopener">${esc(f.t)}</a>`

}

function plain(h){return String(h||"").replace(/<div data-kv[^>]*><\/div>/g," ").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ")}
function kbSearch(q){
  S.q=q;const box=document.getElementById("kbres");if(!box)return;
  q=q.trim().toLowerCase();if(q.length<2){box.innerHTML="";return}
  const hits=allLes().map(l=>{const t=l.t.toLowerCase(),full=plain(l.html+" "+l.task),body=full.toLowerCase();const score=(t.includes(q)?10:0)+(body.split(q).length-1);
    let snip="";const i=body.indexOf(q);if(i>=0&&!t.includes(q))snip=full.slice(Math.max(0,i-50),i+90);return {l,score,snip}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,20);
  const rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),mk=s=>esc(s).replace(rx,m=>`<mark>${m}</mark>`);
  box.innerHTML=hits.length?`<div class="lessons">${hits.map(({l,snip})=>`<button class="les th" onclick="openLes('${esc(l.id)}')"><span class="thumb">${l.cover?`<img src="${esc(l.cover)}" alt="">`:""}</span><span><b>${mk(l.t)}</b><small>${snip?"…"+mk(snip)+"…":"Урок "+esc(l.id)+" · "+esc(l.m.t)}</small></span><span></span></button>`).join("")}</div>`:`<div class="empty">Ничего не нашли. Попробуй другое слово.</div>`;
}

/* ---------- сдать ДЗ ---------- */
// «тип ДЗ»: confirm:<надпись> | file|часть;часть | text|часть;… | text+test|… | test
function hwKind(l){return String(l.hw||"").split(/[|:]/)[0]}
function isTest(l){return /test/.test(hwKind(l))}
function hasHw(l){return ["confirm","text","text+test","file"].includes(hwKind(l))}
function parts(l){const p=String(l.hw||"").split("|")[1];return p?p.split(";"):[hwKind(l)==="confirm"?"Задание":"Всё задание"]}
// название задания: если обложка ГК делилась на несколько уроков — её общее название
function hwTitle(l){return shortT(String(l.hw||"").split("|")[2]||l.t)}
function subsOf(id,part){return S.subs.filter(x=>x.lesson===id&&(part==null||x.part===part||(!x.part&&(parts(findLes(id)).length===1||x.how==='из ГетКурса'))))}
function lastSub(id,part){const a=subsOf(id,part);return a[a.length-1]}
function partsDone(l){return parts(l).filter(p=>lastSub(l.id,p)).length}
const ST={"принято":["ok","принято ✓"],"доработать":["redo","доработать"]};
function stChip(s){if(!s)return `<span class="chip">не сдано</span>`;const x=ST[s.status];
  if(x)return `<span class="chip ${x[0]}">${s.how&&s.how.startsWith("отметка")?"сделано ✓":x[1]}</span>`;
  return `<span class="chip sent">${s.how==="в ЛС"?"в ЛС":"на проверке"}</span>`}
function hwChip(id){const l=findLes(id),n=parts(l).length,d=partsDone(l);
  if(!d)return `<span class="chip">не сдано</span>`;if(n===1)return stChip(lastSub(id,parts(l)[0]));
  return `<span class="chip ${d===n?"ok":"sent"}">${d}/${n}</span>`}

const shortT=t=>{t=t.replace(/^База (м|М)онтажа:\s*/,"").replace(/^Энциклопедия [а-я]+:\s*/i,"");return t.charAt(0).toUpperCase()+t.slice(1)};

// мастер сдачи: модуль → задание → часть → способ
const WZ={mod:null,les:null,part:null,how:null};
function wizardView(pre){
  const mods=S.mods.filter(m=>m.les.some(hasHw));
  if(pre){const l=findLes(pre);if(l&&hasHw(l)&&WZ.les!==l.id){WZ.mod=l.m.n;WZ.les=l.id;WZ.part=null;WZ.how=null}}
  if(!WZ.mod)WZ.mod=mods[0].n;
  const m=mods.find(x=>x.n===WZ.mod)||mods[0],tasks=m.les.filter(hasHw);
  if(WZ.les&&!tasks.some(x=>x.id===WZ.les))WZ.les=null;
  if(!WZ.les&&tasks.length===1)WZ.les=tasks[0].id;
  const l=WZ.les&&findLes(WZ.les),ps=l?parts(l):[];
  if(l&&ps.length===1)WZ.part=ps[0];
  const kind=l?hwKind(l):"";
  if(l&&!WZ.how)WZ.how=kind.startsWith("text")?"text":kind==="confirm"?"done":"upload";
  const step=(n,t)=>`<div class="sec-t">${n} · ${t}</div>`;
  return `<h1 class="h">Сдать работу</h1>
    ${step(1,"Модуль")}<div class="chips">${mods.map(x=>`<button class="chipbtn ${x.n===m.n?"on":""}" onclick="WZ.mod='${esc(x.n)}';WZ.les=null;WZ.part=null;WZ.how=null;route()">${esc(x.t.replace(/-модуль$/,""))}</button>`).join("")}</div>
    ${step(2,"Задание")}<div class="lessons">${tasks.map(x=>`<button class="les th ${x.id===WZ.les?"pick":""}" onclick="WZ.les='${esc(x.id)}';WZ.part=null;WZ.how=null;route();setTimeout(()=>document.getElementById('wzp')?.scrollIntoView({behavior:'smooth',block:'start'}),50)">

    try{
      let fd=null;
      if(m==="upload"&&file)fd={name:file.name,type:file.type,data:await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=bad;r.readAsDataURL(file)})};
      const r=await api({api:"homework",mode:m,lesson:l.id,part:WZ.part,lessonTitle:l.id+" "+l.t,link:m==="upload"?link:"",comment,file:fd});
      if(!r.ok)throw new Error(r.error);
      S.subs=r.hw;saveCache();
      if(TG)try{TG.HapticFeedback.notificationOccurred("success")}catch(e){}
      const left=parts(l).filter(p=>!lastSub(l.id,p));
      toast(m==="done"?"Задание засчитано ✓":"Сдано: "+WZ.part+" ✓");
      if(left.length){WZ.part=left[0];WZ.how=null;route()}else{WZ.les=null;WZ.part=null;WZ.how=null;location.hash="hw"}
    }catch(err){btn.disabled=false;btn.textContent=was;if(err.message!=="auth")toast("Не отправилось: "+(err.message||"нет связи"))}
  };
}

// описание заказа (как в постах биржи) → разделы карточки
function jobParts(t){
  const o={kind:"",fmt:"",tasks:[],about:"",mot:[],notes:[]};let mode="";
  String(t||"").split("\n").forEach(raw=>{const l=raw.trim();if(!l){mode=mode==="tasks"?"":mode;return}
    if(/^📌/.test(l)){const x=l.replace(/^📌\s*/,"").split(" · ");o.kind=x.shift();o.fmt=x.join(" · ");return}
    if(/^Твои задачи/i.test(l)){mode="tasks";return}
    if(/^[•\-–]\s*/.test(l)&&mode==="tasks"){o.tasks.push(l.replace(/^[•\-–]\s*/,""));return}
    if(/^О проекте:/i.test(l)){o.about=l.replace(/^О проекте:\s*/i,"");mode="";return}
    if(/^(ℹ️|🌍)/.test(l)){o.notes.push(l);return}
    o.mot.push(l)});
  return o;
}
function jobCard(j){
  const d=JB.data,done=d.clicked.includes(String(j.id)),seen=(d.viewed||[]).includes(String(j.id)),p=jobParts(j.about);

// «Откликнуться»: окно с двумя шагами — открыть вакансию и отметить результат.
// Не зависит от того, умеет ли браузер (Telegram, iPhone, Android) сообщить о возвращении.
function openJob(id,url,title){
  document.querySelectorAll(".veil.jobask").forEach(v=>v.remove());
  const v=document.createElement("div");v.className="veil jobask";
  v.innerHTML=`<div class="sheet" role="dialog" aria-label="Отклик на вакансию">
    <h3 style="margin:0">${esc(title)}</h3>
    <p class="hint" style="margin:0">1. Открой вакансию и откликнись на площадке.<br>2. Вернись сюда и отметь, что получилось.</p>
    <button class="btn y" id="jgo">Открыть вакансию ↗</button>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn g" id="jy">✓ Откликнулась</button><button class="btn g" id="jn">Просто посмотрела</button></div>
    <button class="btn g" id="jx" style="color:var(--muted)">Закрыть</button></div>`;
  let viewed=false;
  v.querySelector("#jgo").onclick=()=>{
    /t\.me\//.test(url)?openTg(url):(TG&&TG.openLink?TG.openLink(url):window.open(url,"_blank"));
    if(!viewed){viewed=true;api({api:"jobclick",job:id,kind:"просмотр"}).then(r=>{if(r&&r.ok)JB.data=r}).catch(()=>{})}
    v.querySelector("#jgo").textContent="Открыть ещё раз ↗";
  };
  v.querySelector("#jy").onclick=()=>{v.remove();markJob(id)};
  v.querySelector("#jn").onclick=()=>{v.remove();if(!viewed)api({api:"jobclick",job:id,kind:"просмотр"}).then(r=>{if(r&&r.ok){JB.data=r;rerJobs()}}).catch(()=>{});else rerJobs()};
  v.querySelector("#jx").onclick=()=>{v.remove();rerJobs()};
  document.body.appendChild(v);
}
async function markJob(id){
  try{const r=await api({api:"jobclick",job:id,kind:"отклик"});if(r.ok){JB.data=r;toast(`Отклик засчитан · сегодня ${r.today} из ${JOB_GOAL}`);if(location.hash.slice(1)==="jobs")rerJobs()}}catch(e){toast("Нет связи — попробуй ещё раз")}
}
// ± отклики: счётчик меняется сразу, на сервер уходит одна сумма нажатий через полсекунды
let JC={pend:0,t:null};
function jobCount(n){
  const d=JB.data;if(!d)return;
  if(n<0&&(d.today||0)+JC.pend<=0)return;
  JC.pend+=n;d.today=Math.max(0,(d.today||0)+n);d.total=Math.max(0,(d.total||0)+n);
  if(location.hash.slice(1)==="jobs")rerJobs();
  clearTimeout(JC.t);JC.t=setTimeout(async()=>{const k=JC.pend;JC.pend=0;if(!k)return;
    try{const r=await api({api:"jobclick",job:"",kind:"вручную",n:k});if(r.ok&&!JC.pend){JB.data=r;if(location.hash.slice(1)==="jobs")rerJobs()}}
    catch(e){JC.pend+=k;toast("Нет связи — отклики сохранятся, когда появится интернет")}},600);
}

/* ---------- тесты (перенесены из ГК) ---------- */
const TQ={lesson:null,i:0,ans:[],done:false};
function testOf(l){return S.tests&&S.tests[l.id]}
function testResHtml(l){const r=S.testRes&&S.testRes[l.id];return r?`<p class="hint">Пройден: ${esc(r.score)}${r.of?" из "+esc(r.of):""}${r.from==="ГетКурс"?" · в ГетКурсе":""}</p>`:""}
function testView(l){
  const t=testOf(l);if(!t)return `<div class="empty">Тест не найден</div>`;
  if(TQ.lesson!==l.id){TQ.lesson=l.id;TQ.i=0;TQ.ans=[];TQ.done=false}
  const q=t.q;
  if(TQ.done){
    let score=0,max=0;q.forEach((x,i)=>{const right=x.v.filter(v=>v[1]).map(v=>v[0]);if(!right.length)return;max++;const a=TQ.ans[i]||[];if(a.length===right.length&&a.every(v=>right.includes(v)))score++});
    return `<div class="crumbs">Тест · урок ${esc(l.id)}</div><h1 class="h">${esc(t.t)}</h1>
      <div class="box lvl" style="grid-template-columns:120px 1fr"><div class="ring">${ringSvg(max?Math.round(score/max*100):100)}</div><div><b style="font-size:18px">${max?`${score} из ${max} верно`:"Тест пройден ✓"}</b><p class="hint">Результат сохранён. Ниже — разбор ответов.</p></div></div>
      ${q.map((x,i)=>{const right=x.v.filter(v=>v[1]).map(v=>v[0]),a=TQ.ans[i]||[],ok=right.length&&a.length===right.length&&a.every(v=>right.includes(v));
        return `<div class="box" style="gap:6px"><b style="font-size:14px">${i+1}. ${esc(x.t)}</b>${right.length?`<p class="hint" style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"✓ верно":"✗ твой ответ: "+esc(a.join(", ")||"—")}</p>${ok?"":`<p class="hint">Правильно: ${esc(right.join(", "))}</p>`}`:`<p class="hint">${esc(a.join(" "))}</p>`}</div>`}).join("")}
      <a class="btn y" href="#l/${encodeURIComponent(l.id)}">К уроку</a>`;
  }
  const x=q[TQ.i],multi=x.v.filter(v=>v[1]).length>1,free=!x.v.length,a=TQ.ans[TQ.i]||[];
  return `<div class="crumbs">Тест · урок ${esc(l.id)} · вопрос ${TQ.i+1} из ${q.length}</div>
    <span class="bar y" style="height:6px"><i style="width:${Math.round(TQ.i/q.length*100)}%"></i></span>
    <h1 class="h" style="font-size:20px">${esc(x.t)}</h1>${x.d?`<p class="hint">${esc(x.d)}</p>`:""}
    <form class="box" id="tqf">
      ${free?`<textarea name="free" placeholder="…" style="min-height:120px">${esc(a[0]||"")}</textarea>`
        :`${multi?`<p class="hint">Можно выбрать несколько вариантов</p>`:""}<div class="lessons">${x.v.map((v,k)=>`<label class="les" style="grid-template-columns:28px 1fr;cursor:pointer"><input type="${multi?"checkbox":"radio"}" name="v" value="${k}" ${a.includes(v[0])?"checked":""} style="width:20px;height:20px;accent-color:var(--sun)"><span><b style="font-weight:600">${esc(v[0])}</b></span></label>`).join("")}</div>`}
      <div class="navrow">${TQ.i?`<button type="button" class="btn g" onclick="TQ.i--;route()">← Назад</button>`:`<span></span>`}<button class="btn y" type="submit">${TQ.i===q.length-1?"Завершить тест":"Дальше →"}</button></div>
    </form>`;
}
function bindTest(l){
  const f=document.getElementById("tqf");if(!f)return;
  f.onsubmit=async e=>{e.preventDefault();const t=testOf(l),x=t.q[TQ.i];
    let a=[];if(!x.v.length)a=[f.free.value.trim()];else a=[...f.querySelectorAll('input[name="v"]:checked')].map(i=>x.v[+i.value][0]);
    if(!a.length||(!x.v.length&&!a[0]))return toast("Выбери ответ");
    TQ.ans[TQ.i]=a;
    if(TQ.i<t.q.length-1){TQ.i++;route();return}
    TQ.done=true;let score=0,max=0;t.q.forEach((x,i)=>{const right=x.v.filter(v=>v[1]).map(v=>v[0]);if(!right.length)return;max++;const aa=TQ.ans[i]||[];if(aa.length===right.length&&aa.every(v=>right.includes(v)))score++});
    S.testRes=S.testRes||{};S.testRes[l.id]={score,of:max,from:"приложение"};S.done.add(l.id);saveCache();route();
    try{await api({api:"test",qid:t.id,lesson:l.id,score,of:max,answers:t.q.map((x,i)=>({q:x.t,a:(TQ.ans[i]||[]).join("; ")}))})}catch(e){toast("Результат не сохранился — проверь интернет")}
  };
}

function streamHtml(p){

}

async function handoffUrl(){
